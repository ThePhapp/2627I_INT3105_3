    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - field
      - message
      description: field is body/query field name, id, or body for malformed JSON. Never include rejected
        values.
    Error:
      type: object
      additionalProperties: false
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        status:
          type: integer
          enum:
          - 400
          - 401
          - 403
          - 404
          - 409
          - 415
          - 500
        code:
          type: string
          enum:
          - VALIDATION_ERROR
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - NOT_FOUND
          - INVALID_TRANSITION
          - STALE_VERSION
          - DISASTER_NOT_ACTIVE
          - REPORT_NOT_VERIFIED
          - REPORT_ALREADY_ASSIGNED
          - TEAM_BUSY
          - UNSUPPORTED_MEDIA_TYPE
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
          maxLength: 500
        path:
          type: string
          minLength: 1
          maxLength: 2048
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          maxItems: 100
      required:
      - timestamp
      - status
      - code
      - message
      - path
      - fieldErrors
      description: fieldErrors always present; [] except validation errors. path excludes query string.
        No stack trace, credentials or token.
      example:
        timestamp: '2026-10-08T03:00:00Z'
        status: 409
        code: TEAM_BUSY
        message: Team already has an active mission.
        path: /api/rescue-missions
        fieldErrors: []
