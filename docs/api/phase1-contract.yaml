openapi: 3.0.3
info:
  title: GDRN Phase 1 planned contract
  version: 1.0.0
  description: 'P00 design only: exactly E01-E15, not runtime implementation. Normative behavior: phase1-contract.md;
    module contracts and ADR 005. All errors use Error. Unknown/duplicate query keys, nulls and unknown
    body fields rejected with 400.'
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: P01
- name: C1
- name: B1
- name: B1/B2
- name: B2
- name: D1
paths:
  /api/auth/login:
    post:
      operationId: E01
      summary: E01 POST /api/auth/login
      tags:
      - P01
      description: 'Email normalized as EmailAddress; invalid password, unknown user or inactive MVP role:
        identical 401 INVALID_CREDENTIALS. TTL 900 seconds, no refresh. Response Cache-Control: no-store.'
      x-owner: Person 1
      x-task: P01
      x-roles:
      - PUBLIC
      x-consumers:
      - S01
      x-status: planned
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: <issued-jwt-not-a-real-token>
                tokenType: Bearer
                expiresIn: 900
                expiresAt: '2026-10-08T03:15:00Z'
                user:
                  id: 00000000-0000-4000-8000-000000000001
                  email: citizen.one@example.test
                  role: CITIZEN
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache authentication or user data.
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 400
                code: VALIDATION_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors:
                - field: body
                  message: Invalid request shape.
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache authentication or user data.
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 401
                code: INVALID_CREDENTIALS
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache authentication or user data.
        '415':
          description: UNSUPPORTED_MEDIA_TYPE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 415
                code: UNSUPPORTED_MEDIA_TYPE
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache authentication or user data.
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                timestamp: '2026-10-08T03:00:00Z'
                status: 500
                code: INTERNAL_ERROR
                message: Request could not be completed.
                path: /api/auth/login
                fieldErrors: []
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache authentication or user data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: citizen.one@example.test
              password: <from-demo-environment>
