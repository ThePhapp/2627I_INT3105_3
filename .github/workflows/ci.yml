name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile, test architecture, integrate with PostGIS, and package
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Validate Compose
        run: docker compose --env-file .env.example config --quiet
      - name: Build and smoke-test the running foundation
        shell: pwsh
        run: ./scripts/dev.ps1 up
      - name: Stop the foundation (retain database volume)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .env) { ./scripts/dev.ps1 down }
